name: Creator Kit checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/slide-animator/package-lock.json
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --prefix tools/slide-animator
      - run: npm run --prefix tools/slide-animator check
      - run: npx --prefix tools/slide-animator playwright-core install --with-deps chromium
      - run: python3 creator.py prepare examples/demo
      - run: python3 creator.py publish examples/demo
      - run: node tools/slide-animator/check-html.mjs examples/demo
      - run: python3 -m pip install -r requirements-local.txt
      - name: Check local transcription decoder without a model download
        run: |
          python3 - <<'PY'
          from io import BytesIO
          import wave
          from faster_whisper.audio import decode_audio

          fixture = BytesIO()
          with wave.open(fixture, 'wb') as wav:
              wav.setparams((1, 2, 16000, 1600, 'NONE', 'not compressed'))
              wav.writeframes(b'\0' * 3200)
          fixture.seek(0)
          assert len(decode_audio(fixture)) == 1600
          PY
